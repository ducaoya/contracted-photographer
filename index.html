    <style>
      /* ============ 静态 Loading 页（零 JS 依赖，内联防白屏）· 暗黑白透明度 ============ */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 42px;
        background: #0a0a0b;
        color: rgba(255, 255, 255, 0.96);
        font-family: 'Noto Sans SC', system-ui, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #app-loading.is-ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* 快门光圈：白色透明度圆环 */
      .shutter {
        position: relative;
        width: 120px;
        height: 120px;
      }
      .shutter-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-top-color: rgba(255, 255, 255, 0.9);
        animation: spin 1.8s linear infinite;
      }
      .shutter-ring.ring-2 {
        inset: -16px;
        border-color: rgba(255, 255, 255, 0.1);
        border-bottom-color: rgba(255, 255, 255, 0.5);
        animation: spin 3.2s linear infinite reverse;
      }
      .shutter-core {
        position: absolute;
        inset: 32px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02) 70%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); border-color: rgba(255,255,255,0.16); }
        50% { transform: scale(1.05); border-color: rgba(255,255,255,0.4); }
      }
      /* 文案与进度 */
      .loading-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .loading-title {
        font-family: 'Noto Serif SC', serif;
        font-size: 19px;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        color: rgba(255, 255, 255, 0.9);
      }
      .loading-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.34em;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
      }
      .loading-bar {
        width: 180px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
      }
      .loading-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: rgba(255, 255, 255, 0.8);
        animation: sweep 1.4s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .shutter-ring, .shutter-core, .loading-bar::after { animation: none; }
      }
    </style>
  </head>
